name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard against duplicate React / Hono copies
        run: npm run check:dupes

      - name: Lint
        run: npm run lint

      - name: Typecheck, test, build
        run: npx turbo run typecheck test build
